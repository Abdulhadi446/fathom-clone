# Cloudflare terminates TLS and reaches this origin over plain http, so $scheme
# is always "http" here. Without this map every redirect the app builds would
# downgrade to http:// and Secure session cookies would never be sent.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream fathom_app {
    server 127.0.0.1:3100;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 100m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Security headers on every response, including the middleware redirects
    # (nginx sees those first). The app repeats them too for proxy-less setups.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Browsers ignore HSTS over plain http (direct-IP access keeps working);
    # it takes effect only when Cloudflare serves the site over https.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://fathom_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
